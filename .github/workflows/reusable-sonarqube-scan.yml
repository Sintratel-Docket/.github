name: Reusable - SonarQube Scan

# Shared static-analysis and coverage gate for every SINTRATEL Docket
# microservice, following the same split as reusable-security-scan.yml: the
# scan logic is identical for every stack, only the project key and the
# coverage report path change.
#
# This targets the self-hosted SonarQube Community Edition deployed by
# gitops-manifests (dev/apps/sonarqube.yaml), reachable only internally in the
# dev cluster today. Until an organization variable SONAR_HOST_URL is set to
# a URL GitHub Actions can reach, the job is skipped rather than failing every
# pipeline that has nothing to scan yet.
#
# The quality gate step ships with `continue-on-error: true` on purpose, same
# spirit as Trivy's warn mode: flip it off per repository once findings on the
# existing codebases have been triaged.

on:
  workflow_call:
    inputs:
      project_key:
        description: "SonarQube project key, e.g. docket-todos-api"
        required: true
        type: string
      coverage_artifact:
        description: "Name of the coverage artifact uploaded by the test job, if any"
        required: false
        default: ""
        type: string
      sonar_args:
        description: "Extra sonar-scanner properties, e.g. coverage report paths"
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    if: ${{ vars.SONAR_HOST_URL != '' }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube uses blame info for new-code detection
          persist-credentials: false

      - name: Download coverage artifact
        if: ${{ inputs.coverage_artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.coverage_artifact }}
        continue-on-error: true

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v4
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ inputs.project_key }}
            -Dsonar.sources=.
            ${{ inputs.sonar_args }}

      - name: Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@v1
        continue-on-error: true # warn mode until findings are triaged
        timeout-minutes: 5
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
